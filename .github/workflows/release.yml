name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate version
        shell: python
        run: |
          import ast, os
          from pathlib import Path
          tree=ast.parse(Path('outputs/white-dragon-desktop/updates.py').read_text(encoding='utf-8'))
          version=next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='APP_VERSION' for t in n.targets))
          if os.environ['GITHUB_EVENT_NAME']=='push' and (os.environ['GITHUB_REF_TYPE']!='tag' or os.environ['GITHUB_REF_NAME']!='v'+version):
              raise SystemExit('Push the matching vVERSION tag to publish')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('RELEASE_VERSION='+version+'\n')
      - run: python -m PyInstaller --noconfirm --distpath dist --workpath build work/white-dragon-desktop/WhiteDragon.spec
      - name: Validate packaged UI
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          Copy-Item outputs/white-dragon-desktop/assets dist/assets -Recurse
          $pet = Start-Process dist/WhiteDragon/WhiteDragon.exe -ArgumentList '--smoke-test','--report',"$PWD/smoke.json" -Wait -PassThru
          Write-Output "Smoke process exit code $($pet.ExitCode)"
          if (Test-Path smoke.json) { Get-Content smoke.json -Raw }
          if (Test-Path dist/desktop.log) { Get-Content dist/desktop.log -Tail 30 }
          $report = Get-Content smoke.json -Raw | ConvertFrom-Json
          # Hosted Windows disables system animations. Verify one paint per
          # state here; display refresh performance is tested on a real desktop.
          $states = @($report.assets.PSObject.Properties)
          $badAssets = @($states | Where-Object { -not $_.Value.loaded })
          $badFlags = @($report.flags.PSObject.Properties | Where-Object { -not $_.Value })
          if ($pet.ExitCode -ne 0 -or $badAssets.Count -or $badFlags.Count -or $report.errors.Count -or $report.paint_events -lt $states.Count) { throw 'Packaged UI validation failed' }
      - run: python work/white-dragon-desktop/package_release.py --runtime dist/WhiteDragon --output release --version ${{ env.RELEASE_VERSION }}
      - name: Validate complete release package
        timeout-minutes: 2
        shell: python
        run: |
          import json, os, subprocess, zipfile
          from pathlib import Path
          version=os.environ['RELEASE_VERSION']
          with zipfile.ZipFile(f'release/WhiteDragon-v{version}-windows-x64.zip') as archive:
              archive.extractall('verification')
          env=dict(os.environ,QT_QPA_PLATFORM='offscreen')
          subprocess.run(['verification/WhiteDragon/WhiteDragon.exe','--update-health-check',str(Path('health.json').resolve())],env=env,timeout=45,check=True)
          report=json.loads(Path('health.json').read_text(encoding='utf-8'))
          if not report['ok'] or report['version']!=version:
              raise SystemExit('Release manifest or image decoding failed')
      - name: Publish
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already published'; exit 0 }
          gh release create $env:GITHUB_REF_NAME release/* --verify-tag --title "小白龙 $env:RELEASE_VERSION" --notes-file CHANGELOG.md
